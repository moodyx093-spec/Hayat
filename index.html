  @media (max-width: 700px){
    body::before{ background-size: auto 78vh; opacity: .22; }
  }
  .card{ position: relative; z-index: 1; }
  .card{
    width:100%;
    max-width: 440px;
    text-align:center;
    background: none;
    border: 0;
    padding: 8px 6px;
  }
  .lang-toggle{
    position: fixed;
    top: calc(18px + env(safe-area-inset-top, 0px));
    right: 16px;
    z-index: 10;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--gold);
    background: rgba(255,255,255,0.12);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border: 0;
    border-radius: 20px;
    padding: 7px 16px;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: border-color .15s ease, background .15s ease;
  }
  .lang-toggle:hover{ background: rgba(255,255,255,0.2); }
  .logo-ring{
    width: min(300px, 100%);
    margin: 0 auto 20px;
    border-radius: 28px;
    overflow: hidden;
    border: 0;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    line-height: 0;
  }
  .logo-ring img{ width:100%; height:auto; display:block; }

  h1{
    font-size: 32px;
    font-weight: 900;
    margin: 0 0 2px;
    color: var(--gold);
    letter-spacing: .3px;
  }
  .subtitle{
    margin: 0 0 12px;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: var(--muted);
  }
  html[lang="en"] h1{ font-family: 'Cormorant Garamond', Georgia, serif; font-size: 33px; letter-spacing: 2px; text-transform: uppercase; }
  html[lang="en"] .subtitle{ letter-spacing: 3px; text-transform: uppercase; }
  .tagline{
    font-size: 16px;
    color: var(--cream);
    margin: 0 0 22px;
    font-weight:600;
  }
  html[lang="ar"] h1{ font-family:'Noto Kufi Arabic','Cairo',sans-serif; font-weight:700; font-size:30px; letter-spacing:0; }
  html[lang="ar"] .subtitle,
  html[lang="ar"] .tagline{ font-family:'Noto Kufi Arabic','Cairo',sans-serif; font-weight:600; letter-spacing:0; }
  html[lang="ar"] .tagline{ font-size:15px; }
  .rule{
    height: 28px;
    margin: 0 auto 24px;
    background: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20220%2028%22%20width%3D%22220%22%20height%3D%2228%22%20fill%3D%22none%22%20stroke%3D%22%23D9B36C%22%20stroke-width%3D%221.4%22%20stroke-linecap%3D%22round%22%3E%0A%3Cpath%20d%3D%22M10%2014H88M132%2014H210%22%20opacity%3D%22.7%22%2F%3E%0A%3Cpath%20d%3D%22M110%205L113.5%2014L110%2023L106.5%2014Z%22%20fill%3D%22%23D9B36C%22%2F%3E%0A%3Cg%20fill%3D%22%23D9B36C%22%20fill-opacity%3D%22.85%22%20stroke%3D%22none%22%3E%0A%3Cpath%20d%3D%22M96%2014C93%209%2089%208%2086%209C88%2013%2091%2015%2096%2014Z%22%2F%3E%3Cpath%20d%3D%22M96%2014C93%2019%2089%2020%2086%2019C88%2015%2091%2013%2096%2014Z%22%2F%3E%0A%3Cpath%20d%3D%22M124%2014C127%209%20131%208%20134%209C132%2013%20129%2015%20124%2014Z%22%2F%3E%3Cpath%20d%3D%22M124%2014C127%2019%20131%2020%20134%2019C132%2015%20129%2013%20124%2014Z%22%2F%3E%0A%3C%2Fg%3E%3C%2Fsvg%3E") no-repeat center / 220px 28px;
  }

  .actions{
    display:flex;
    flex-direction:column;
    gap: 12px;
    margin-bottom: 26px;
  }
  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    padding: 15px 20px;
    border-radius: 16px;
    font-family:inherit;
    font-size: 16px;
    font-weight:600;
    text-decoration:none;
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
    border: 0;
    color: var(--cream);
    background: rgba(255,255,255,0.10);
    -webkit-backdrop-filter: blur(24px);
    backdrop-filter: blur(24px);
  }
  .btn:active{ transform: scale(0.98); }
  .btn.primary{
    background: linear-gradient(180deg, #E4C27F, var(--gold));
    color: #2a0f14;
    font-weight:800;
  }
  .btn.primary:hover{ background:#ecc987; }
  .btn.ghost:hover{ background: rgba(255,255,255,0.17); }
  .btn svg{ flex-shrink:0; }
  .btn .num{ font-size: 13px; font-weight: 600; color: var(--gold); direction: ltr; unicode-bidi: isolate; }

  .divider-text{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 12px;
    color: var(--muted);
    font-size: 12.5px;
    margin: 24px 0 16px;
  }
  

  .social{ display:flex; justify-content:center; gap: 14px; }
  .social a{
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 0;
    background: rgba(255,255,255,0.10);
    -webkit-backdrop-filter: blur(24px);
    backdrop-filter: blur(24px);
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--gold);
    text-decoration:none;
    transition: border-color .15s ease, background .15s ease, color .15s ease;
  }
  .social a:hover{ background: var(--gold); color: var(--bg); }

  .footnote{
    margin: 30px 0 0;
    font-size: 15px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 1px;
  }
  a:focus-visible, button:focus-visible{ outline: 2px solid var(--gold); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce){ .btn{ transition:none; } }

  /* ===== المينيو الإلكتروني ===== */
  .menu-viewer{ position:fixed; inset:0; z-index:100; background:var(--bg); display:none; flex-direction:column; }
  .menu-viewer.open{ display:flex; }
  .menu-bar{
    -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px; background:var(--bg); color:var(--cream);
  }
  .menu-bar h2{ margin:0; font-size:17px; font-weight:700; flex:1; color:var(--gold); }
  .menu-close{
    width:40px; height:40px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    color:var(--cream); border:0; background:rgba(255,255,255,0.12); border-radius:50%; cursor:pointer;
    transition:background .15s ease,color .15s ease;
  }
  .menu-close:hover{ background:rgba(255,255,255,0.2); color:var(--gold); }
  .mn-head{ flex:0 0 auto; background:var(--bg); border-bottom:1px solid var(--line); }
  #mnSearch{
    display:block; width:calc(100% - 28px); margin:2px 14px 8px; border:1px solid var(--line);
    background:rgba(255,255,255,0.08); color:var(--cream); border-radius:20px; padding:9px 16px;
    font:inherit; font-size:14px; outline:0;
  }
  #mnSearch::placeholder{ color:var(--muted); }
  #mnNav{ display:flex; gap:8px; overflow-x:auto; padding:2px 14px 10px; scrollbar-width:none; }
  #mnNav::-webkit-scrollbar{ display:none; }
  #mnNav button{
    flex:none; border:1px solid var(--line); background:rgba(255,255,255,0.08); color:var(--cream);
    border-radius:20px; padding:7px 14px; font:600 14px Cairo,sans-serif; cursor:pointer;
  }
  #mnNav button.on{ background:var(--gold); color:#2a0f14; border-color:var(--gold); }
  .menu-scroll{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 14px calc(28px + env(safe-area-inset-bottom,0px)); }
  #mnMain{ max-width:720px; margin:0 auto; }
  #mnMain h3{ margin:22px 0 4px; font-size:20px; color:var(--gold); font-weight:800; }
  .mn-note{ color:var(--muted); font-size:12.5px; margin-bottom:6px; }
  .mn-item{ display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.07); border:1px solid var(--line); border-radius:16px; padding:12px 14px; margin-top:8px; }
  .mn-pic{ flex:none; position:relative; width:84px; height:84px; border-radius:14px; border:1px solid var(--line); overflow:hidden; background:var(--bg-soft); display:flex; align-items:center; justify-content:center; font-size:32px; }
  .mn-pic span{ position:absolute; opacity:.85; }
  .mn-pic img{ position:relative; width:100%; height:100%; object-fit:cover; display:block; }
  .mn-info{ flex:1; min-width:0; text-align:center; }
  .mn-nm{ font-weight:600; font-size:15.5px; color:var(--cream); }
  .mn-ds{ color:var(--muted); font-size:12.5px; line-height:1.5; }
  .mn-pr{ flex:none; align-self:center; color:var(--gold); font-weight:800; font-size:14px; white-space:nowrap; background:rgba(217,179,108,0.16); border:1px solid var(--gold-dim); border-radius:12px; padding:6px 10px; direction:rtl; }
  .mn-ask{ font-size:12px; color:var(--muted); font-weight:400; }
  .mn-empty{ text-align:center; color:var(--muted); padding:30px 0; }
</style>
</head>

const ORDER=['hd','fp','ms','fj','ck','mj','sd','ds','sh','cp','wf','bf','mn','sw','ml'];
MENU.sort((a,b)=>ORDER.indexOf(a.id)-ORDER.indexOf(b.id));
</script>

<script>
  const translations = {
    ar: {
      title: "حياة جرش",
      sub: "كافيه ومطعم",
      tagline: "حيث يلتقي الذوق بالفخامة",
      menu: "قائمة الطعام والأراجيل",
      call: "اتصل بنا",
      location: "موقعنا على الخريطة",
      review: "قيّمنا على جوجل",
      follow: "تابعنا",
      footnote: "قهوة . لحظات . وأكثر",
      toggleLabel: "English",
      search: "ابحث في المينيو...",
      logoAlt: "شعار حياة جرش",
      pageAlt: "قائمة حياة جرش – صفحة",
      page: "صفحة",
      of: "من",
      close: "إغلاق",
      docTitle: "حياة جرش | كافيه ومطعم",
      dir: "rtl",
      lang: "ar"
    },
    en: {
      title: "Hayat Jerash",
      sub: "Café & Restaurant",
      tagline: "Where taste meets luxury",
      menu: "Food & Shisha Menu",
      call: "Call Us",
      location: "Our Location",
      review: "Rate Us on Google",
      follow: "Follow Us",
      footnote: "Coffee . Moments . More",
      toggleLabel: "عربي",
      search: "Search the menu...",
      logoAlt: "Hayat Jerash logo",
      pageAlt: "Hayat Jerash menu – page",
      page: "Page",
      of: "of",
      close: "Close",
      docTitle: "Hayat Jerash | Café & Restaurant",
      dir: "ltr",
      lang: "en"
    }
  };

  let currentLang = "ar";

  function setText(id, value){ document.getElementById(id).textContent = value; }

  function applyLang(lang){
    const t = translations[lang];
    setText("txt-title", t.title);
    setText("txt-sub", t.sub);
    setText("txt-tagline", t.tagline);
    setText("txt-menu", t.menu);
    setText("txt-call", t.call);
    setText("txt-location", t.location);
    setText("txt-review", t.review);
    setText("txt-follow", t.follow);
    setText("txt-footnote", t.footnote);
    setText("langToggle", t.toggleLabel);
    setText("menuHeaderTitle", t.menu);
    document.getElementById("menuClose").setAttribute("aria-label", t.close);
    document.getElementById("logoImg").setAttribute("alt", t.logoAlt);
    document.documentElement.setAttribute("dir", t.dir);
    document.documentElement.setAttribute("lang", t.lang);
    document.title = t.docTitle;
    mnSearch.placeholder = t.search;
    currentLang = lang;
  }

  function toggleLang(){ applyLang(currentLang === "ar" ? "en" : "ar"); }

  /* ===== المينيو الإلكتروني ===== */
  const menuViewer = document.getElementById("menuViewer");
  const menuScroll = document.getElementById("menuScroll");
  const mnMain = document.getElementById("mnMain");
  const mnNav = document.getElementById("mnNav");
  const mnSearch = document.getElementById("mnSearch");
  let menuPushed = false;
  let curTab = "";
  const fmt = n => n.toFixed(2) + " " + CUR;

  function renderMenu(){
    const term = mnSearch.value.trim();
    let h = "";
    MENU.forEach(c => {
      const its = c.items.map((it,i)=>[it,i+1]).filter(([it]) => !term || it[0].includes(term) || c.n.includes(term));
      if(!its.length) return;
      h += `<section id="mn-${c.id}"><h3>${c.e} ${c.n}</h3>${c.note?`<div class="mn-note">${c.note}</div>`:""}`;
      its.forEach(([it,n]) => {
        const src = IMAGES[it[0]] || `img/${c.id}-${n}.jpg`;
        h += `<div class="mn-item"><div class="mn-pic"><span>${c.e}</span><img src="${src}" alt="${it[0]}" loading="lazy" onerror="this.remove()"></div>`+
             `<div class="mn-info"><div class="mn-nm">${it[0]}</div>${it[2]?`<div class="mn-ds">${it[2]}</div>`:""}`+
             `</div><div class="mn-pr">${it[1]==null?'<span class="mn-ask">اسأل النادل</span>':fmt(it[1])}</div></div>`;
      });
      h += "</section>";
    });
    mnMain.innerHTML = h || '<div class="mn-empty">لا توجد نتائج</div>';
    curTab = ""; spy();
  }

  mnNav.innerHTML = MENU.map(c => `<button type="button" data-c="${c.id}">${c.e} ${c.n}</button>`).join("");

  function goTo(id){
    const el = document.getElementById("mn-" + id);
    if(!el) return;
    menuScroll.scrollTo({ top: el.getBoundingClientRect().top - menuScroll.getBoundingClientRect().top + menuScroll.scrollTop - 4, behavior: "auto" });
  }

  function spy(){
    const base = menuScroll.getBoundingClientRect().top;
    let cur = null;
    MENU.forEach(c => { const el = document.getElementById("mn-" + c.id); if(el && el.getBoundingClientRect().top - base <= 30) cur = c.id; });
    if(!cur){ const f = mnMain.querySelector("section"); cur = f ? f.id.slice(3) : null; }
    if(cur === curTab) return;
    curTab = cur;
    mnNav.querySelectorAll("button").forEach(x => {
      const on = x.dataset.c === cur;
      x.classList.toggle("on", on);
      if(on) mnNav.scrollLeft += (x.getBoundingClientRect().left + x.offsetWidth/2) - (mnNav.getBoundingClientRect().left + mnNav.clientWidth/2);
    });
  }

  mnSearch.addEventListener("input", renderMenu);
  menuScroll.addEventListener("scroll", spy, { passive: true });
  mnNav.addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b) return;
    if(mnSearch.value){ mnSearch.value = ""; renderMenu(); }
    goTo(b.dataset.c);
  });
  renderMenu();

  function openMenu(e){
    if (e) e.preventDefault();
    menuViewer.classList.add("open");
    menuViewer.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    menuScroll.scrollTop = 0;
    curTab = ""; spy();
    try { history.pushState({ menu: true }, "", "#menu"); menuPushed = true; } catch (err) { menuPushed = false; }
    document.getElementById("menuClose").focus();
  }

  function closeMenu(fromPop){
    if (!menuViewer.classList.contains("open")) return;
    menuViewer.classList.remove("open");
    menuViewer.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    if (!fromPop && menuPushed){ menuPushed = false; history.back(); }
    else { menuPushed = false; }
    document.getElementById("openMenu").focus();
  }

  document.getElementById("langToggle").addEventListener("click", toggleLang);
  document.getElementById("openMenu").addEventListener("click", openMenu);
  document.getElementById("menuClose").addEventListener("click", function(){ closeMenu(false); });
  window.addEventListener("popstate", function(){ closeMenu(true); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeMenu(false); });
  applyLang("ar");
</script>


</body>
</html>
